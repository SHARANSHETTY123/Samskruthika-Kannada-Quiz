<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ಸಾಂಸ್ಕೃತಿಕ ಕನ್ನಡ — MCQ Quiz</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--ink:#172033;--muted:#667085;--bg:#f4f7fb;--card:#fff;--line:#dfe6f1;--good:#16803c;--bad:#c62828;}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Kannada",sans-serif;background:linear-gradient(180deg,#eef4ff 0,#f7f9fc 45%,#eef2f7 100%);color:var(--ink)}
header{background:linear-gradient(135deg,#0f2a5f,#2563eb);color:#fff;padding:28px 16px;text-align:center;box-shadow:0 5px 20px #153a7a33}header h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.9}.wrap{max-width:920px;margin:22px auto;padding:0 14px}.card{background:var(--card);border:1px solid #e6ebf3;border-radius:18px;padding:20px;box-shadow:0 8px 30px #1d355712;margin-bottom:16px}.start{max-width:620px;margin:30px auto}.start h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}.primary{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.primary:hover{background:var(--blue2)}button{font:inherit}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{padding:7px 11px;border-radius:999px;background:#edf3ff;color:#1e4f9d;font-weight:800}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);width:0;transition:width .2s}.question{font-size:21px;line-height:1.65;font-weight:700;margin:13px 0 18px}.option{display:block;border:2px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;cursor:pointer;background:#fff;transition:.15s}.option:hover{border-color:#7ba5ee;background:#f8fbff}.option input{margin-right:9px;transform:scale(1.12)}.option.correct{border-color:#31a65a;background:#eaf8ef}.option.wrong{border-color:#e34d4d;background:#fff0f0}.option.disabled{cursor:default}.feedback{padding:12px 14px;border-radius:12px;margin-top:12px;font-weight:700}.feedback.good{background:#eaf8ef;color:#146b32}.feedback.bad{background:#fff0f0;color:#a51f1f}.controls{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.controls button{min-width:120px;border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.secondary{background:#e9eef7;color:#20304a}.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;margin-top:14px}.num{background:#eef3fa;color:#243b5a;padding:8px 3px;text-align:center;border-radius:8px;cursor:pointer;font-weight:800}.num.done{background:#c7ddff}.num.correct{background:#bde8ca;color:#155b2d}.num.wrong{background:#ffd0d0;color:#8a1c1c}.num.current{outline:3px solid #3b82f6}.result{display:none}.score{font-size:38px;font-weight:900}.review{margin-top:15px}.review-item{border-top:1px solid var(--line);padding:13px 0}.muted{color:var(--muted)}.small{font-size:13px}.hidden{display:none!important}.source-note{font-size:12px;color:#6b7280;margin-top:12px}.footer{text-align:center;color:#718096;padding:10px 0 28px}
@media(max-width:600px){header h1{font-size:23px}.card{padding:15px}.question{font-size:18px}.controls button{min-width:0;flex:1}.grid{grid-template-columns:repeat(8,1fr)}}
</style></head>
<body>
<header><h1>ಸಾಂಸ್ಕೃತಿಕ ಕನ್ನಡ</h1><p>ಬಹು ಆಯ್ಕೆ ಪ್ರಶ್ನೋತ್ತರ — 455 Questions</p></header>
<div class="wrap">
<section id="start" class="card start">
<h2>Quiz ಆರಂಭಿಸಿ</h2><p class="muted">ನಿಮ್ಮ ಹೆಸರು ಮತ್ತು ಪ್ರಶ್ನೆಗಳ ವ್ಯಾಪ್ತಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.</p>
<div class="field"><label for="player">ಹೆಸರು</label><input id="player" placeholder="ನಿಮ್ಮ ಹೆಸರು ಬರೆಯಿರಿ"></div>
<div class="field"><label for="range">ಪ್ರಶ್ನೆಗಳು</label><select id="range"><option value="1-455">ಎಲ್ಲಾ 455 ಪ್ರಶ್ನೆಗಳು</option><option value="1-100">Q1–100</option><option value="101-200">Q101–200</option><option value="201-300">Q201–300</option><option value="301-400">Q301–400</option><option value="401-455">Q401–455</option></select></div>
<button class="primary" id="startBtn">Start Quiz</button>
</section>
<section id="quizCard" class="card hidden">
<div class="top"><strong id="count">Question 1</strong><span class="pill" id="answered">0 answered</span></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="quiz"></div>
<div class="controls"><button class="secondary" id="prev">Previous</button><button class="primary" id="next">Next</button></div>
</section>
<section id="navCard" class="card hidden"><div class="top"><strong>Question Navigator</strong><button class="danger" id="reset">Reset</button></div><div class="grid" id="grid"></div></section>
<section id="result" class="card result"><div class="score" id="score"></div><p id="resultMsg" class="muted"></p><button class="primary" id="again">Take Again</button><div class="review" id="review"></div></section>
<div class="footer">GitHub Pages ready • No server required</div>
</div>
<script src="questions.js"></script><script>
let bank=[],idx=0,answers={},locked={},player='';
const $=id=>document.getElementById(id); const store='samskruthikaKannadaQuizV2';
function save(){localStorage.setItem(store,JSON.stringify({player,answers,locked}));}
function render(){const q=bank[idx]; $('count').textContent=`Question ${idx+1} of ${bank.length} • Q${q.id}`;$('answered').textContent=`${Object.keys(answers).length} answered`;$('bar').style.width=((idx+1)/bank.length*100)+'%';const chosen=answers[q.id];const isLocked=locked[q.id];let h=`<div class="question">${esc(q.question)}</div>`;q.options.forEach((o,i)=>{let cls='option';if(isLocked&&i===q.answer)cls+=' correct';if(isLocked&&chosen===i&&chosen!==q.answer)cls+=' wrong';h+=`<label class="${cls}${isLocked?' disabled':''}"><input type="radio" name="opt" value="${i}" ${chosen===i?'checked':''} ${isLocked?'disabled':''}> <b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`});if(isLocked){const ok=chosen===q.answer;h+=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ ಸರಿಯಾದ ಉತ್ತರ':'✗ ತಪ್ಪು ಉತ್ತರ'} — ${esc(q.answerText||q.options[q.answer]||'Answer key not available')}</div>`}else if(q.answer===null){h+=`<div class="feedback bad">ಈ ಪ್ರಶ್ನೆಗೆ answer key ಲಭ್ಯವಿಲ್ಲ.</div>`}$('quiz').innerHTML=h;document.querySelectorAll('input[name="opt"]').forEach(el=>el.onchange=e=>{answers[q.id]=Number(e.target.value);locked[q.id]=true;save();render();updateGrid()});$('prev').disabled=idx===0;$('next').textContent=idx===bank.length-1?'Finish':'Next';updateGrid()}
function updateGrid(){$('grid').innerHTML=bank.map((q,i)=>{let c='num'+(answers[q.id]!==undefined?' done':'');if(locked[q.id])c+=answers[q.id]===q.answer?' correct':' wrong';if(i===idx)c+=' current';return `<div class="${c}" onclick="jump(${i})">${q.id}</div>`}).join('')}
function jump(i){idx=i;render();scrollTo({top:0,behavior:'smooth'})}
function finish(){let correct=bank.filter(q=>answers[q.id]===q.answer).length;let answered=Object.keys(answers).length;let pct=Math.round(correct/bank.length*100);$('score').textContent=`${correct} / ${bank.length}`;$('resultMsg').textContent=`${player?player+', ':''}${answered} answered • ${pct}% score`;let r=bank.map(q=>{let a=answers[q.id];return `<div class="review-item"><b>Q${q.id}. ${esc(q.question)}</b><div>Your answer: ${a===undefined?'Not answered':esc(q.options[a])}</div><div>Correct: ${q.answer===null?'Not available':esc(q.options[q.answer])}</div></div>`}).join('');$('review').innerHTML='<h3>Answer Review</h3>'+r;$('quizCard').classList.add('hidden');$('navCard').classList.add('hidden');$('result').style.display='block';scrollTo({top:0,behavior:'smooth'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('startBtn').onclick=()=>{player=$('player').value.trim();let [a,b]=$('range').value.split('-').map(Number);bank=QUESTIONS.filter(q=>q.id>=a&&q.id<=b);idx=0;answers={};locked={};$('start').classList.add('hidden');$('quizCard').classList.remove('hidden');$('navCard').classList.remove('hidden');$('result').style.display='none';render()};
$('prev').onclick=()=>{if(idx>0){idx--;render();scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(idx<bank.length-1){idx++;render();scrollTo({top:0,behavior:'smooth'})}else finish()};$('reset').onclick=()=>{if(confirm('ಈ quiz ಅನ್ನು reset ಮಾಡಬೇಕೇ?')){answers={};locked={};save();render()}};$('again').onclick=()=>location.reload();
</script></body></html>
